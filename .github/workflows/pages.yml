name: Xuat ban ban xem thu len GitHub Pages

# Bản xem thử TĨNH: https://vinakin.github.io/winduca.com/
# Không có API biểu mẫu (xuất tĩnh không hỗ trợ route handler). Bản chạy thật dùng Vercel.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Cai thu vien
        run: npm ci

      - name: Loai API khoi ban tinh
        run: rm -rf src/app/api

      - name: Build tinh
        run: npm run build
        env:
          GITHUB_PAGES: "true"
          NEXT_PUBLIC_LEAD_ENDPOINT: ${{ vars.LEAD_ENDPOINT }}
          NEXT_PUBLIC_GA_ID: ${{ vars.GA_ID }}

      - name: Tao 404.html cho Pages
        run: test -f out/404.html || cp out/_not-found/index.html out/404.html || true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
